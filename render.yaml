services:
  - type: web
    name: rendiya
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: RENDIYA_API_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
